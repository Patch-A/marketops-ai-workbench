              "Location": { "required": true, "schema": { "type": "string", "pattern": "^/v1/projects/[0-9a-f-]{36}/wbs-plans/[0-9a-f-]{36}/approvals\\?planVersion=[1-9][0-9]*$" } },
              "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } }
