{
  "openapi": "3.1.0",
  "info": {
    "title": "MarketOps Project Import API",
    "version": "0.4.0",
    "description": "M1 proposal-to-schedule and M2 project retrieval API contract. Authorization scope is resolved from the authenticated deployment actor and is never accepted from request bodies."
  },
  "paths": {
    "/v1/project-imports": {
      "post": {
        "operationId": "importProject",
        "summary": "Create a planning project from retained source and approved proposal files",
        "security": [
          {
            "deploymentActor": []
          },
          {
            "browserDeploymentActor": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 200
            },
            "description": "A caller-generated retry key scoped by the server-authenticated workspace and client."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "projectName",
                  "proposalVersion",
                  "approvalConfirmed",
                  "sourceFile",
                  "proposalFile"
                ],
                "properties": {
                  "projectName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 300
                  },
                  "proposalVersion": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "approvalConfirmed": {
                    "type": "boolean",
                    "const": true
                  },
                  "sourceFile": {
                    "type": "string",
                    "format": "binary",
                    "x-max-size-bytes": 26214400
                  },
                  "proposalFile": {
                    "type": "string",
                    "format": "binary",
                    "x-max-size-bytes": 26214400
                  }
                }
              },
              "encoding": {
                "sourceFile": {
                  "contentType": "text/markdown, text/plain, text/csv, application/csv, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                },
                "proposalFile": {
                  "contentType": "text/markdown, text/plain, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Project created or an identical idempotent import replayed.",
            "headers": {
              "Location": {
                "required": true,
                "schema": {
                  "type": "string",
                  "pattern": "^/v1/projects/[0-9a-f-]{36}$"
                }
              },
              "Cache-Control": {
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "projectId",
                    "sourceArtifactId",
                    "sourceVersionId",
                    "proposalArtifactId",
                    "proposalVersionId",
                    "manifestSha256",
                    "replayed"
                  ],
                  "properties": {
                    "projectId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "sourceArtifactId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "sourceVersionId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "proposalVersionId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "proposalArtifactId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "manifestSha256": {
                      "type": "string",
                      "pattern": "^[a-f0-9]{64}$"
                    },
                    "replayed": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "415": { "$ref": "#/components/responses/ImportFailure" },
          "422": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects": {
      "get": {
        "operationId": "listProjects",
        "summary": "List projects visible in the authenticated workspace and client",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 20 }
          }
        ],
        "responses": {
          "200": {
            "description": "A deterministic newest-first project list.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": { "type": "string", "const": "no-store" }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["projects"],
                  "properties": {
                    "projects": {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/ProjectSummary" }
                    }
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}": {
      "get": {
        "operationId": "getProject",
        "summary": "Read one project and its retained source and approved proposal metadata",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "parameters": [
          {
            "name": "projectId",
            "in": "path",
            "required": true,
            "schema": { "type": "string", "format": "uuid" }
          }
        ],
        "responses": {
          "200": {
            "description": "Project detail from the server fact source.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": { "type": "string", "const": "no-store" }
              }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ProjectDetail" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/source-indexes": {
      "post": {
        "operationId": "createSourceIndex",
        "summary": "Create or replay an index for one retained artifact version",
        "security": [ { "deploymentActor": [] }, { "browserDeploymentActor": [] } ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IndexSourceRequest" } } }
        },
        "responses": {
          "201": {
            "description": "Source index created or replayed.",
            "headers": {
              "Location": { "required": true, "schema": { "type": "string", "pattern": "^/v1/projects/[0-9a-f-]{36}/source-indexes/[0-9a-f-]{36}$" } },
              "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SourceIndexMutationResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "415": { "$ref": "#/components/responses/ImportFailure" },
          "422": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/source-indexes/{indexId}": {
      "get": {
        "operationId": "getSourceIndex",
        "summary": "Read one source index status without returning source text",
        "security": [ { "deploymentActor": [] }, { "browserDeploymentActor": [] } ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "indexId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": {
            "description": "Current source index status.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SourceIndex" } } }
          },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/retrieval-searches": {
      "post": {
        "operationId": "searchProjectSources",
        "summary": "Search ready indexes within one authenticated project",
        "security": [ { "deploymentActor": [] }, { "browserDeploymentActor": [] } ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RetrievalSearchRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Deterministic cited retrieval results.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RetrievalSearchResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "422": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/source-indexes/{indexId}/withdrawal": {
      "post": {
        "operationId": "withdrawSourceIndex",
        "summary": "Withdraw one index and remove its derived chunk text",
        "security": [ { "deploymentActor": [] }, { "browserDeploymentActor": [] } ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "indexId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "type": "object", "additionalProperties": false, "maxProperties": 0 } } }
        },
        "responses": {
          "200": {
            "description": "Source index withdrawn or an identical withdrawal replayed.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SourceIndexMutationResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/extraction-runs": {
      "post": {
        "operationId": "createExtractionRun",
        "summary": "Create or replay a server-derived review run",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "Idempotency-Key", "in": "header", "required": true, "schema": { "type": "string", "minLength": 8, "maxLength": 200 } }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": ["expectedProposalVersionId", "expectedProposalSha256"],
                "properties": {
                  "expectedProposalVersionId": { "type": "string", "format": "uuid" },
                  "expectedProposalSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Review run created or an identical persistent request replayed.",
            "headers": {
              "Location": { "required": true, "schema": { "type": "string", "pattern": "^/v1/projects/[0-9a-f-]{36}/extraction-runs/[0-9a-f-]{36}$" } },
              "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReviewCreateResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "422": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      },
      "get": {
        "operationId": "listExtractionRuns",
        "summary": "List review runs for one authenticated project scope",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 20 } }
        ],
        "responses": {
          "200": {
            "description": "Deterministic newest-first review run summaries.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "type": "object", "additionalProperties": false, "required": ["runs"], "properties": { "runs": { "type": "array", "items": { "$ref": "#/components/schemas/ReviewRunSummary" } } } } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/extraction-runs/{runId}": {
      "get": {
        "operationId": "getExtractionRunReview",
        "summary": "Read the latest or selected immutable review version",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "runId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "reviewVersion", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1 } }
        ],
        "responses": {
          "200": {
            "description": "A complete immutable review version with cited candidates.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReviewDetail" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/extraction-runs/{runId}/decisions": {
      "post": {
        "operationId": "decideReviewCandidate",
        "summary": "Create one human decision from the expected review version",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "runId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": ["expectedReviewVersion", "candidateId", "action", "reason"],
                "properties": {
                  "expectedReviewVersion": { "type": "integer", "minimum": 1 },
                  "candidateId": { "type": "string", "format": "uuid" },
                  "action": { "type": "string", "enum": ["approve", "modify", "reject"] },
                  "reason": { "type": "string", "minLength": 1, "maxLength": 2000 },
                  "comment": { "type": ["string", "null"], "minLength": 1, "maxLength": 4000 },
                  "replacementText": { "type": ["string", "null"], "minLength": 1, "maxLength": 10000 }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "A new immutable review version and decision.",
            "headers": {
              "Location": { "required": true, "schema": { "type": "string", "pattern": "^/v1/projects/[0-9a-f-]{36}/extraction-runs/[0-9a-f-]{36}\\?reviewVersion=[1-9][0-9]*$" } },
              "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReviewDecisionResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/wbs-plans": {
      "post": {
        "operationId": "createWbsPlan",
        "summary": "Create or replay a WBS plan from one completed review snapshot",
        "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": {
            "type": "object", "additionalProperties": false,
            "required": ["reviewRunId", "reviewVersion"],
            "properties": {
              "reviewRunId": { "type": "string", "format": "uuid" },
              "reviewVersion": { "type": "integer", "minimum": 1 }
            }
          } } }
        },
        "responses": {
          "201": {
            "description": "WBS plan created or the same immutable review source replayed.",
            "headers": {
              "Location": { "required": true, "schema": { "type": "string", "pattern": "^/v1/projects/[0-9a-f-]{36}/wbs-plans/[0-9a-f-]{36}\\?planVersion=[1-9][0-9]*$" } },
              "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WbsPlanCreateResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "422": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/wbs-plans/{planId}": {
      "get": {
        "operationId": "getWbsPlan",
        "summary": "Read the latest or an explicit immutable WBS plan version",
        "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "planId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "planVersion", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1 } }
        ],
        "responses": {
          "200": {
            "description": "A scoped WBS plan version.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WbsPlan" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/projects/{projectId}/wbs-plans/{planId}/revisions": {
      "post": {
        "operationId": "reviseWbsPlan",
        "summary": "Append one optimistic-concurrency WBS revision",
        "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }],
        "parameters": [
          { "name": "projectId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "planId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WbsRevisionRequest" } } }
        },
        "responses": {
          "201": {
            "description": "A new immutable WBS plan version.",
            "headers": {
              "Location": { "required": true, "schema": { "type": "string", "pattern": "^/v1/projects/[0-9a-f-]{36}/wbs-plans/[0-9a-f-]{36}\\?planVersion=[1-9][0-9]*$" } },
              "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/WbsPlan" } } }
          },
