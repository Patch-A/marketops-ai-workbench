        "responses": {
          "201": { "description": "Fixed query set created.", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GeoQuerySetResult" } } } },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
