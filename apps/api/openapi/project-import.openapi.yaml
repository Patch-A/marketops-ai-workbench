      "ResearchRunCreateRequest": { "type": "object", "additionalProperties": false, "required": ["briefId", "sources", "observations"], "properties": { "briefId": { "type": "string", "format": "uuid" }, "sources": { "type": "array", "minItems": 1, "items": { "type": "object" } }, "observations": { "type": "array", "minItems": 1, "items": { "type": "object" } } } },
      "ResearchRunResult": { "type": "object", "additionalProperties": false, "required": ["researchRun"], "properties": { "researchRun": { "type": "object" } } },
      "ProposalDraftCreateRequest": { "type": "object", "additionalProperties": false, "required": ["briefId", "researchRunId"], "properties": { "briefId": { "type": "string", "format": "uuid" }, "researchRunId": { "type": "string", "format": "uuid" } } },
