  "components": {
    "securitySchemes": {
      "deploymentActor": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "deployment-issued token",
        "description": "The adapter resolves actor, organization, workspace, and client scope from server-controlled authentication state."
      },
      "browserDeploymentActor": {
        "type": "http",
        "scheme": "basic",
        "description": "Browser-native credentials for the same private deployment. The server-configured username and deployment token password are never embedded in assets or browser storage."
      }
    },
    "schemas": {
      "BriefCreateRequest": { "type": "object", "additionalProperties": false, "required": ["deidentified", "productName", "productType", "targetMarket", "audience", "objective", "timeframe", "background", "constraints"], "properties": { "deidentified": { "const": true }, "productName": { "type": "string" }, "productType": { "type": "string" }, "targetMarket": { "type": "string" }, "audience": { "type": "string" }, "objective": { "type": "string" }, "timeframe": { "type": "string" }, "background": { "type": "string" }, "constraints": { "type": "array", "items": { "type": "string" } } } },
      "BriefResult": { "type": "object", "additionalProperties": false, "required": ["brief"], "properties": { "brief": { "type": "object" } } },
      "BriefListResult": { "type": "object", "additionalProperties": false, "required": ["briefs"], "properties": { "briefs": { "type": "array", "items": { "type": "object" } } } },
      "ContentBriefCreateRequest": { "type": "object", "additionalProperties": false, "required": ["topic", "channel", "format", "audience"], "properties": { "briefId": { "type": "string", "format": "uuid" }, "expectedVersion": { "type": "integer", "minimum": 1 }, "topic": { "type": "string", "maxLength": 200 }, "channel": { "type": "string", "maxLength": 100 }, "format": { "type": "string", "maxLength": 100 }, "audience": { "type": "string", "maxLength": 2000 } } },
      "ContentBriefApprovalRequest": { "type": "object", "additionalProperties": false, "required": ["expectedVersion"], "properties": { "expectedVersion": { "type": "integer", "minimum": 1 } } },
      "ContentBrief": { "type": "object", "additionalProperties": false, "required": ["briefId", "createdAt", "updatedAt", "version", "topic", "channel", "format", "audience", "status", "approvedAt"], "properties": { "briefId": { "type": "string", "format": "uuid" }, "createdAt": { "type": "string", "format": "date-time" }, "updatedAt": { "type": "string", "format": "date-time" }, "version": { "type": "integer" }, "topic": { "type": "string" }, "channel": { "type": "string" }, "format": { "type": "string" }, "audience": { "type": "string" }, "status": { "type": "string", "enum": ["draft", "approved"] }, "approvedAt": { "type": ["string", "null"], "format": "date-time" } } },
      "ContentBriefMutationResult": { "type": "object", "additionalProperties": false, "required": ["brief"], "properties": { "brief": { "$ref": "#/components/schemas/ContentBrief" } } },
      "ContentBriefListResult": { "type": "object", "additionalProperties": false, "required": ["briefs"], "properties": { "briefs": { "type": "array", "items": { "$ref": "#/components/schemas/ContentBrief" } } } },
      "ContentAsset": { "type": "object", "additionalProperties": false, "required": ["assetId", "briefId", "createdAt", "updatedAt", "version", "title", "channel", "format", "assetType", "prompt", "status"], "properties": { "assetId": { "type": "string", "format": "uuid" }, "briefId": { "type": "string", "format": "uuid" }, "createdAt": { "type": "string", "format": "date-time" }, "updatedAt": { "type": "string", "format": "date-time" }, "version": { "type": "integer" }, "title": { "type": "string" }, "channel": { "type": "string" }, "format": { "type": "string" }, "assetType": { "type": "string", "enum": ["content", "image"] }, "prompt": { "type": "string" }, "status": { "type": "string", "enum": ["draft", "needs_authorization", "queued", "ready", "failed"] } } },
      "ContentAssetCreateRequest": { "type": "object", "additionalProperties": false, "required": ["briefId", "title", "channel", "format", "assetType"], "properties": { "briefId": { "type": "string", "format": "uuid" }, "title": { "type": "string" }, "channel": { "type": "string" }, "format": { "type": "string" }, "assetType": { "type": "string", "enum": ["content", "image"] }, "prompt": { "type": "string" } } },
      "ContentAssetUpdateRequest": { "type": "object", "additionalProperties": false, "required": ["expectedVersion", "status"], "properties": { "expectedVersion": { "type": "integer", "minimum": 1 }, "status": { "type": "string", "enum": ["draft", "needs_authorization", "queued", "ready", "failed"] } } },
      "ContentAssetMutationResult": { "type": "object", "additionalProperties": false, "required": ["asset"], "properties": { "asset": { "$ref": "#/components/schemas/ContentAsset" } } },
      "ContentAssetListResult": { "type": "object", "additionalProperties": false, "required": ["assets"], "properties": { "assets": { "type": "array", "items": { "$ref": "#/components/schemas/ContentAsset" } } } },
      "CalendarItem": { "type": "object", "additionalProperties": false, "required": ["itemId", "createdAt", "updatedAt", "version", "title", "date", "source", "note", "status"], "properties": { "itemId": { "type": "string", "format": "uuid" }, "createdAt": { "type": "string", "format": "date-time" }, "updatedAt": { "type": "string", "format": "date-time" }, "version": { "type": "integer" }, "title": { "type": "string" }, "date": { "type": "string", "format": "date" }, "source": { "type": "string" }, "note": { "type": "string" }, "status": { "type": "string", "enum": ["draft", "confirmed"] } } },
      "CalendarItemCreateRequest": { "type": "object", "additionalProperties": false, "required": ["title", "date", "source", "note"], "properties": { "title": { "type": "string" }, "date": { "type": "string", "format": "date" }, "source": { "type": "string" }, "note": { "type": "string" } } },
      "CalendarItemUpdateRequest": { "type": "object", "additionalProperties": false, "required": ["expectedVersion", "status"], "properties": { "expectedVersion": { "type": "integer", "minimum": 1 }, "status": { "type": "string", "enum": ["draft", "confirmed"] } } },
      "CalendarItemMutationResult": { "type": "object", "additionalProperties": false, "required": ["item"], "properties": { "item": { "$ref": "#/components/schemas/CalendarItem" } } },
      "CalendarItemListResult": { "type": "object", "additionalProperties": false, "required": ["items"], "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/CalendarItem" } } } },
      "ObsidianConnectionRequest": { "type": "object", "additionalProperties": false, "required": ["vaultPath", "relativePaths"], "properties": { "vaultPath": { "type": "string", "minLength": 1, "maxLength": 500 }, "relativePaths": { "type": "array", "maxItems": 200, "description": "Empty selects the configured vault root. Entries are safe relative Markdown file or directory paths.", "items": { "type": "string", "minLength": 1, "maxLength": 500 } } } },
      "ObsidianConnection": { "type": "object", "additionalProperties": false, "required": ["connectionId", "vaultPath", "relativePaths", "status", "createdAt", "updatedAt"], "properties": { "connectionId": { "type": "string" }, "vaultPath": { "type": "string" }, "relativePaths": { "type": "array", "items": { "type": "string" } }, "status": { "type": "string", "enum": ["connected"] }, "createdAt": { "type": "string", "format": "date-time" }, "updatedAt": { "type": "string", "format": "date-time" } } },
      "ObsidianConnectionResult": { "type": "object", "additionalProperties": false, "required": ["connection"], "properties": { "connection": { "anyOf": [{ "$ref": "#/components/schemas/ObsidianConnection" }, { "type": "null" }] } } },
      "ObsidianConnectionMutationResult": { "type": "object", "additionalProperties": false, "required": ["connection"], "properties": { "connection": { "$ref": "#/components/schemas/ObsidianConnection" } } },
      "ObsidianNote": { "type": "object", "additionalProperties": false, "required": ["relativePath", "title", "modifiedAt", "sha256", "sizeBytes"], "properties": { "relativePath": { "type": "string" }, "title": { "type": "string" }, "modifiedAt": { "type": "string", "format": "date-time" }, "sha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" }, "sizeBytes": { "type": "integer", "minimum": 0 } } },
