{
  "openapi": "3.1.0",
  "info": {
    "title": "MarketOps Project Import API",
    "version": "0.1.0",
    "description": "M1-01 contract only. Authorization scope is resolved from the authenticated deployment actor and is never accepted from multipart fields."
  },
  "paths": {
    "/v1/project-imports": {
      "post": {
        "operationId": "importProject",
        "summary": "Create a planning project from retained source and approved proposal files",
        "security": [
          {
            "deploymentActor": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 200
            },
            "description": "A caller-generated retry key scoped by the server-authenticated workspace and client."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "projectName",
                  "proposalVersion",
                  "approvalConfirmed",
                  "sourceFile",
                  "proposalFile"
                ],
                "properties": {
                  "projectName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 300
                  },
                  "proposalVersion": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "approvalConfirmed": {
                    "type": "boolean",
                    "const": true
                  },
                  "sourceFile": {
                    "type": "string",
                    "format": "binary",
                    "x-max-size-bytes": 26214400
                  },
                  "proposalFile": {
                    "type": "string",
                    "format": "binary",
                    "x-max-size-bytes": 26214400
                  }
                }
              },
              "encoding": {
                "sourceFile": {
                  "contentType": "text/markdown, text/plain, text/csv, application/csv, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                },
                "proposalFile": {
                  "contentType": "text/markdown, text/plain, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Project created or an identical idempotent import replayed.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "projectId",
                    "sourceArtifactId",
                    "sourceVersionId",
                    "proposalArtifactId",
                    "proposalVersionId",
                    "manifestSha256",
                    "replayed"
                  ],
                  "properties": {
                    "projectId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "sourceArtifactId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "sourceVersionId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "proposalVersionId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "proposalArtifactId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "manifestSha256": {
                      "type": "string",
                      "pattern": "^[a-f0-9]{64}$"
                    },
                    "replayed": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "415": { "$ref": "#/components/responses/ImportFailure" },
          "422": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "deploymentActor": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "deployment-issued token",
        "description": "The adapter resolves actor, organization, workspace, and client scope from server-controlled authentication state."
      }
    },
    "schemas": {
      "ImportError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "retryable",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_INPUT",
              "AUTHORIZATION_REQUIRED",
              "UNSUPPORTED_FORMAT",
              "INVALID_MEDIA_TYPE",
              "INVALID_DOCUMENT",
              "APPROVAL_REQUIRED",
              "PAYLOAD_TOO_LARGE",
              "OBJECT_WRITE_FAILED",
              "OBJECT_INTEGRITY_MISMATCH",
              "IDEMPOTENCY_CONFLICT",
              "INVALID_SERVER_ID",
              "INVALID_SERVER_CLOCK",
              "DATABASE_WRITE_FAILED"
            ]
          },
          "message": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "requestId": {
            "type": "string"
          }
        }
      }
    },
    "responses": {
      "AuthenticationFailure": {
        "description": "The deployment bearer token is missing or invalid.",
        "headers": {
          "WWW-Authenticate": {
            "required": true,
            "schema": {
              "type": "string",
              "const": "Bearer"
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ImportError"
            }
          }
        }
      },
      "ImportFailure": {
        "description": "Stable import failure. Response bodies and logs never include source bytes or storage credentials.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ImportError"
            }
          }
        }
      }
    }
  }
}
