  },
  "components": {
    "securitySchemes": {
      "deploymentActor": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "deployment-issued token",
        "description": "The adapter resolves actor, organization, workspace, and client scope from server-controlled authentication state."
      },
      "browserDeploymentActor": {
        "type": "http",
        "scheme": "basic",
        "description": "Browser-native credentials for the same private deployment. The server-configured username and deployment token password are never embedded in assets or browser storage."
      }
    },
    "schemas": {
      "ProjectSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["projectId", "name", "status", "approvedProposalVersion", "createdAt"],
        "properties": {
          "projectId": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "status": { "type": "string", "enum": ["planning", "active", "archived"] },
          "approvedProposalVersion": { "type": "integer", "minimum": 1 },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "ProjectFile": {
        "type": "object",
        "additionalProperties": false,
        "required": ["artifactId", "versionId", "filename", "mediaType", "sizeBytes"],
        "properties": {
          "artifactId": { "type": "string", "format": "uuid" },
          "versionId": { "type": "string", "format": "uuid" },
          "filename": { "type": "string" },
          "mediaType": { "type": "string" },
          "sizeBytes": { "type": "integer", "minimum": 0 }
        }
      },
      "ApprovedProposal": {
        "type": "object",
        "additionalProperties": false,
        "required": ["artifactId", "versionId", "filename", "mediaType", "sizeBytes", "sha256", "proposalVersion", "approvalStatus", "approvedAt"],
        "properties": {
          "artifactId": { "type": "string", "format": "uuid" },
          "versionId": { "type": "string", "format": "uuid" },
          "filename": { "type": "string" },
          "mediaType": { "type": "string" },
          "sizeBytes": { "type": "integer", "minimum": 0 },
          "sha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "proposalVersion": { "type": "integer", "minimum": 1 },
          "approvalStatus": { "type": "string", "const": "approved" },
          "approvedAt": { "type": "string", "format": "date-time" }
        }
      },
      "IndexSourceRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["artifactVersionId"],
        "properties": {
          "artifactVersionId": { "type": "string", "format": "uuid" }
        }
      },
      "SourceIndex": {
        "type": "object",
        "additionalProperties": false,
        "required": ["indexId", "artifactVersionId", "status", "sourceSha256", "parserVersion", "chunkerVersion", "indexSha256", "chunkCount"],
        "properties": {
          "indexId": { "type": "string", "format": "uuid" },
          "artifactVersionId": { "type": "string", "format": "uuid" },
          "status": { "type": "string", "enum": ["ready", "withdrawn"] },
          "sourceSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "parserVersion": { "type": "string", "pattern": "^[a-z0-9][a-z0-9._-]{0,63}$" },
          "chunkerVersion": { "type": "string", "pattern": "^[a-z0-9][a-z0-9._-]{0,63}$" },
          "indexSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "chunkCount": { "type": "integer", "minimum": 0, "maximum": 5000 }
        }
      },
      "SourceIndexMutationResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["indexId", "artifactVersionId", "status", "sourceSha256", "parserVersion", "chunkerVersion", "indexSha256", "chunkCount", "replayed"],
        "properties": {
          "indexId": { "type": "string", "format": "uuid" },
          "artifactVersionId": { "type": "string", "format": "uuid" },
          "status": { "type": "string", "enum": ["ready", "withdrawn"] },
          "sourceSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "parserVersion": { "type": "string", "pattern": "^[a-z0-9][a-z0-9._-]{0,63}$" },
          "chunkerVersion": { "type": "string", "pattern": "^[a-z0-9][a-z0-9._-]{0,63}$" },
          "indexSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "chunkCount": { "type": "integer", "minimum": 0, "maximum": 5000 },
          "replayed": { "type": "boolean" }
        }
      },
      "RetrievalSearchRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["query"],
        "properties": {
          "query": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "limit": { "type": "integer", "minimum": 1, "maximum": 20, "default": 10 }
        }
      },
      "RetrievalCitation": {
        "type": "object",
        "additionalProperties": false,
        "required": ["indexId", "chunkId", "artifactVersionId", "sourceSha256", "contentSha256", "location", "parserVersion", "chunkerVersion", "freshness"],
        "properties": {
          "indexId": { "type": "string", "format": "uuid" },
          "chunkId": { "type": "string", "format": "uuid" },
          "artifactVersionId": { "type": "string", "format": "uuid" },
          "sourceSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "contentSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "location": { "type": "object", "minProperties": 1, "maxProperties": 16 },
          "parserVersion": { "type": "string", "pattern": "^[a-z0-9][a-z0-9._-]{0,63}$" },
          "chunkerVersion": { "type": "string", "pattern": "^[a-z0-9][a-z0-9._-]{0,63}$" },
          "freshness": { "type": "string", "const": "fresh" }
        }
      },
      "RetrievalSearchHit": {
        "type": "object",
        "additionalProperties": false,
        "required": ["rank", "lexicalRank", "ngramRank", "lexicalScore", "ngramScore", "combinedScore", "excerpt", "citation"],
        "properties": {
          "rank": { "type": "integer", "minimum": 1, "maximum": 20 },
          "lexicalRank": { "type": "integer", "minimum": 1 },
          "ngramRank": { "type": "integer", "minimum": 1 },
          "lexicalScore": { "type": "number", "minimum": 0, "maximum": 1 },
          "ngramScore": { "type": "number", "minimum": 0, "maximum": 1 },
          "combinedScore": { "type": "number", "minimum": 0, "maximum": 1 },
          "excerpt": { "type": "string", "maxLength": 600 },
          "citation": { "$ref": "#/components/schemas/RetrievalCitation" }
        }
      },
      "RetrievalSearchResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["retrievalMode", "scoredCandidateCount", "resultCount", "runSha256", "results"],
        "properties": {
          "retrievalMode": { "type": "string", "const": "lexical_ngram" },
          "scoredCandidateCount": { "type": "integer", "minimum": 0 },
          "resultCount": { "type": "integer", "minimum": 0, "maximum": 20 },
          "runSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "results": { "type": "array", "maxItems": 20, "items": { "$ref": "#/components/schemas/RetrievalSearchHit" } }
        }
      },
      "ProjectDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": ["projectId", "name", "status", "createdAt", "sourceFile", "approvedProposal"],
        "properties": {
          "projectId": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "status": { "type": "string", "enum": ["planning", "active", "archived"] },
          "createdAt": { "type": "string", "format": "date-time" },
          "sourceFile": { "$ref": "#/components/schemas/ProjectFile" },
          "approvedProposal": { "$ref": "#/components/schemas/ApprovedProposal" }
        }
      },
      "ReviewRunSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["runId", "proposalVersionId", "proposalSha256", "candidateCount", "latestReviewVersion", "createdAt"],
        "properties": {
          "runId": { "type": "string", "format": "uuid" },
          "proposalVersionId": { "type": "string", "format": "uuid" },
          "proposalSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "candidateCount": { "type": "integer", "minimum": 1, "maximum": 1000 },
          "latestReviewVersion": { "type": "integer", "minimum": 1 },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "ReviewCreateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["runId", "reviewVersion", "candidateCount", "proposalVersionId", "proposalSha256", "replayed", "createdAt"],
        "properties": {
          "runId": { "type": "string", "format": "uuid" },
          "reviewVersion": { "type": "integer", "const": 1 },
          "candidateCount": { "type": "integer", "minimum": 1, "maximum": 1000 },
          "proposalVersionId": { "type": "string", "format": "uuid" },
          "proposalSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "replayed": { "type": "boolean" },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "ReviewDecision": {
        "type": "object",
        "additionalProperties": false,
        "required": ["decisionId", "reviewVersion", "candidateId", "action", "reason", "comment", "replacementText", "actorId", "createdAt"],
        "properties": {
          "decisionId": { "type": "string", "format": "uuid" },
          "reviewVersion": { "type": "integer", "minimum": 2 },
          "candidateId": { "type": "string", "format": "uuid" },
          "action": { "type": "string", "enum": ["approve", "modify", "reject"] },
          "reason": { "type": "string" },
          "comment": { "type": ["string", "null"] },
          "replacementText": { "type": ["string", "null"] },
          "actorId": { "type": "string", "format": "uuid" },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "ReviewCandidate": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ordinal", "candidateId", "kind", "text", "classification", "confidence", "sourceCitation", "review"],
        "properties": {
          "ordinal": { "type": "integer", "minimum": 1 },
          "candidateId": { "type": "string", "format": "uuid" },
          "kind": { "type": "string", "enum": ["deliverable", "milestone", "constraint", "assumption"] },
          "text": { "type": "string" },
          "classification": { "type": "string", "enum": ["fact", "hypothesis"] },
          "confidence": { "type": "number", "minimum": 0, "maximum": 1 },
          "sourceCitation": { "$ref": "#/components/schemas/SourceCitation" },
          "review": {
            "type": "object",
            "additionalProperties": false,
            "required": ["status", "replacementText", "lastDecision"],
            "properties": {
              "status": { "type": "string", "enum": ["pending", "approve", "modify", "reject"] },
              "replacementText": { "type": ["string", "null"] },
              "lastDecision": { "oneOf": [{ "$ref": "#/components/schemas/ReviewDecision" }, { "type": "null" }] }
            }
          }
        }
      },
      "SourceLocation": {
        "oneOf": [
          { "type": "object", "additionalProperties": false, "required": ["kind", "startLine", "endLine"], "properties": { "kind": { "const": "line_range" }, "startLine": { "type": "integer", "minimum": 1 }, "endLine": { "type": "integer", "minimum": 1 } } },
          { "type": "object", "additionalProperties": false, "required": ["kind", "startRow", "endRow"], "properties": { "kind": { "const": "csv_range" }, "startRow": { "type": "integer", "minimum": 1 }, "endRow": { "type": "integer", "minimum": 1 } } },
          { "type": "object", "additionalProperties": false, "required": ["kind", "part", "bodyIndex", "paragraph"], "properties": { "kind": { "const": "docx_paragraph" }, "part": { "type": "string", "minLength": 1 }, "bodyIndex": { "type": "integer", "minimum": 1 }, "paragraph": { "type": "integer", "minimum": 1 } } },
          { "type": "object", "additionalProperties": false, "required": ["kind", "part", "bodyIndex", "table"], "properties": { "kind": { "const": "docx_table" }, "part": { "type": "string", "minLength": 1 }, "bodyIndex": { "type": "integer", "minimum": 1 }, "table": { "type": "integer", "minimum": 1 } } },
          { "type": "object", "additionalProperties": false, "required": ["kind", "line", "columnIndex"], "properties": { "kind": { "const": "markdown_table_cell" }, "line": { "type": "integer", "minimum": 1 }, "columnIndex": { "type": "integer", "minimum": 1 } } },
          { "type": "object", "additionalProperties": false, "required": ["kind", "row", "columnIndex", "columnName"], "properties": { "kind": { "const": "csv_cell" }, "row": { "type": "integer", "minimum": 1 }, "columnIndex": { "type": "integer", "minimum": 1 }, "columnName": { "type": "string", "minLength": 1 } } },
          { "type": "object", "additionalProperties": false, "required": ["kind", "part", "table", "row", "column"], "properties": { "kind": { "const": "docx_table_cell" }, "part": { "type": "string", "minLength": 1 }, "table": { "type": "integer", "minimum": 1 }, "row": { "type": "integer", "minimum": 1 }, "column": { "type": "integer", "minimum": 1 } } }
        ]
      },
      "SourceCitation": {
        "type": "object",
        "additionalProperties": false,
        "required": ["sourceVersionId", "sourceSha256", "location", "sectionPath", "quote"],
        "properties": {
          "sourceVersionId": { "type": "string", "format": "uuid" },
          "sourceSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "location": { "$ref": "#/components/schemas/SourceLocation" },
          "sectionPath": { "type": "array", "items": { "type": "string", "minLength": 1 } },
          "quote": { "type": "string", "minLength": 1 }
        }
      },
      "ReviewDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": ["run", "selectedReviewVersion", "availableReviewVersions", "selectedDecision", "candidates"],
        "properties": {
          "run": { "$ref": "#/components/schemas/ReviewRunSummary" },
          "selectedReviewVersion": { "type": "integer", "minimum": 1 },
          "availableReviewVersions": { "type": "array", "minItems": 1, "items": { "type": "integer", "minimum": 1 } },
          "selectedDecision": { "oneOf": [{ "$ref": "#/components/schemas/ReviewDecision" }, { "type": "null" }] },
          "candidates": { "type": "array", "minItems": 1, "maxItems": 1000, "items": { "$ref": "#/components/schemas/ReviewCandidate" } }
        }
      },
      "ReviewDecisionResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["runId", "reviewVersion", "decision"],
        "properties": {
          "runId": { "type": "string", "format": "uuid" },
          "reviewVersion": { "type": "integer", "minimum": 2 },
          "decision": { "$ref": "#/components/schemas/ReviewDecision" }
        }
      },
      "WbsTask": {
        "type": "object",
        "additionalProperties": false,
        "required": ["taskId", "candidateId", "kind", "classification", "sourceText", "title", "sourceCitation", "reviewStatus", "durationWorkdays", "predecessors", "ownerRole", "plannedStart", "plannedFinish", "hardDeadline", "approvedBufferWorkdays", "isLocked", "status"],
        "properties": {
          "taskId": { "type": "string", "pattern": "^candidate:[0-9a-f-]{36}$" },
          "candidateId": { "type": "string", "format": "uuid" },
          "kind": { "type": "string", "enum": ["deliverable", "milestone"] },
          "classification": { "type": "string", "enum": ["fact", "hypothesis"] },
          "sourceText": { "type": "string", "minLength": 1 },
          "title": { "type": "string", "minLength": 1 },
          "sourceCitation": { "$ref": "#/components/schemas/SourceCitation" },
          "reviewStatus": { "type": "string", "enum": ["approve", "modify"] },
          "durationWorkdays": { "type": "integer", "minimum": 1 },
          "predecessors": { "type": "array", "uniqueItems": true, "items": { "type": "string", "pattern": "^candidate:[0-9a-f-]{36}$" } },
          "ownerRole": { "type": "string" },
          "plannedStart": { "type": ["string", "null"], "format": "date" },
          "plannedFinish": { "type": ["string", "null"], "format": "date" },
          "hardDeadline": { "type": ["string", "null"], "format": "date" },
          "approvedBufferWorkdays": { "type": "integer", "minimum": 0 },
          "isLocked": { "type": "boolean" },
          "status": { "type": "string", "enum": ["not_started", "in_progress", "blocked", "completed", "cancelled"] }
        }
      },
      "WbsControl": {
        "type": "object",
        "additionalProperties": false,
        "required": ["candidateId", "kind", "classification", "sourceText", "text", "sourceCitation", "reviewStatus"],
        "properties": {
          "candidateId": { "type": "string", "format": "uuid" },
          "kind": { "type": "string", "enum": ["constraint", "assumption"] },
          "classification": { "type": "string", "enum": ["fact", "hypothesis"] },
          "sourceText": { "type": "string", "minLength": 1 },
          "text": { "type": "string", "minLength": 1 },
          "sourceCitation": { "$ref": "#/components/schemas/SourceCitation" },
          "reviewStatus": { "type": "string", "enum": ["approve", "modify"] }
        }
      },
      "WbsPlan": {
        "type": "object",
        "additionalProperties": false,
        "required": ["planId", "projectId", "proposalVersionId", "proposalSha256", "sourceReviewRunId", "sourceReviewSnapshotId", "sourceReviewVersion", "selectedPlanVersion", "availablePlanVersions", "status", "planDigest", "createdAt", "tasks", "controls"],
        "properties": {
          "planId": { "type": "string", "format": "uuid" },
          "projectId": { "type": "string", "format": "uuid" },
          "proposalVersionId": { "type": "string", "format": "uuid" },
          "proposalSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "sourceReviewRunId": { "type": "string", "format": "uuid" },
          "sourceReviewSnapshotId": { "type": "string", "format": "uuid" },
          "sourceReviewVersion": { "type": "integer", "minimum": 1 },
          "selectedPlanVersion": { "type": "integer", "minimum": 1 },
          "availablePlanVersions": { "type": "array", "minItems": 1, "uniqueItems": true, "items": { "type": "integer", "minimum": 1 } },
          "status": { "type": "string", "const": "draft" },
          "planDigest": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "createdAt": { "type": "string", "format": "date-time" },
          "tasks": { "type": "array", "minItems": 1, "maxItems": 1000, "items": { "$ref": "#/components/schemas/WbsTask" } },
          "controls": { "type": "array", "maxItems": 1000, "items": { "$ref": "#/components/schemas/WbsControl" } }
        }
      },
      "WbsPlanCreateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["plan", "replayed"],
        "properties": {
          "plan": { "$ref": "#/components/schemas/WbsPlan" },
          "replayed": { "type": "boolean" }
        }
      },
      "WbsTaskChanges": {
        "type": "object",
        "additionalProperties": false,
        "minProperties": 1,
        "properties": {
          "title": { "type": "string", "minLength": 1 },
          "durationWorkdays": { "type": "integer", "minimum": 1 },
          "predecessors": { "type": "array", "uniqueItems": true, "items": { "type": "string", "pattern": "^candidate:[0-9a-f-]{36}$" } },
          "ownerRole": { "type": "string" },
          "plannedStart": { "type": ["string", "null"], "format": "date" },
          "plannedFinish": { "type": ["string", "null"], "format": "date" },
          "hardDeadline": { "type": ["string", "null"], "format": "date" },
          "approvedBufferWorkdays": { "type": "integer", "minimum": 0 },
          "isLocked": { "type": "boolean" },
          "status": { "type": "string", "enum": ["not_started", "in_progress", "blocked", "completed", "cancelled"] }
        }
      },
      "WbsRevisionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["expectedPlanVersion", "taskUpdates"],
        "properties": {
          "expectedPlanVersion": { "type": "integer", "minimum": 1 },
          "taskUpdates": {
            "type": "array", "minItems": 1, "maxItems": 1000,
            "items": {
              "type": "object", "additionalProperties": false,
              "required": ["taskId", "changes"],
              "properties": {
                "taskId": { "type": "string", "pattern": "^candidate:[0-9a-f-]{36}$" },
                "changes": { "$ref": "#/components/schemas/WbsTaskChanges" }
              }
            }
          }
        }
      },
      "ScheduleRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["expectedPlanVersion", "projectStart", "holidays"],
        "properties": {
          "expectedPlanVersion": { "type": "integer", "minimum": 1 },
          "projectStart": { "type": "string", "format": "date" },
          "holidays": { "type": "array", "uniqueItems": true, "items": { "type": "string", "format": "date" } }
        }
      },
      "ScheduledTask": {
        "type": "object",
        "additionalProperties": false,
        "required": ["taskId", "candidateId", "title", "sourceCitation", "predecessors", "durationWorkdays", "approvedBufferWorkdays", "isLocked", "calculatedStart", "calculatedFinish", "requiredStart", "hardDeadline"],
        "properties": {
          "taskId": { "type": "string" },
          "candidateId": { "type": "string", "format": "uuid" },
          "title": { "type": "string" },
          "sourceCitation": { "$ref": "#/components/schemas/SourceCitation" },
          "predecessors": { "type": "array", "items": { "type": "string" } },
          "durationWorkdays": { "type": "integer", "minimum": 1 },
          "approvedBufferWorkdays": { "type": "integer", "minimum": 0 },
          "isLocked": { "type": "boolean" },
          "calculatedStart": { "type": "string", "format": "date" },
          "calculatedFinish": { "type": "string", "format": "date" },
          "requiredStart": { "type": "string", "format": "date" },
          "hardDeadline": { "type": ["string", "null"], "format": "date" }
        }
      },
      "ScheduleSnapshot": {
        "type": "object",
        "additionalProperties": false,
        "required": ["snapshotId", "planId", "planVersion", "status", "projectStart", "holidays", "planDigest", "scheduleDigest", "createdAt", "topologicalOrder", "tasks", "conflicts", "deadlineMisses", "sourceDateDrift"],
        "properties": {
          "snapshotId": { "type": "string", "format": "uuid" },
          "planId": { "type": "string", "format": "uuid" },
          "planVersion": { "type": "integer", "minimum": 1 },
          "status": { "type": "string", "enum": ["ready", "needs_review"] },
          "projectStart": { "type": "string", "format": "date" },
          "holidays": { "type": "array", "uniqueItems": true, "items": { "type": "string", "format": "date" } },
          "planDigest": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "scheduleDigest": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "createdAt": { "type": "string", "format": "date-time" },
          "topologicalOrder": { "type": "array", "items": { "type": "string" } },
          "tasks": { "type": "array", "minItems": 1, "items": { "$ref": "#/components/schemas/ScheduledTask" } },
          "conflicts": { "type": "array", "items": { "type": "object" } },
          "deadlineMisses": { "type": "array", "items": { "type": "object" } },
          "sourceDateDrift": { "type": "array", "items": { "type": "object" } }
        }
      },
      "ScheduleCreateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["snapshot", "replayed"],
        "properties": {
          "snapshot": { "$ref": "#/components/schemas/ScheduleSnapshot" },
          "replayed": { "type": "boolean" }
        }
      },
      "PlanApprovalRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["expectedPlanVersion", "scheduleSnapshotId", "reason"],
        "properties": {
          "expectedPlanVersion": { "type": "integer", "minimum": 1 },
          "scheduleSnapshotId": { "type": "string", "format": "uuid" },
          "reason": { "type": "string", "minLength": 1, "maxLength": 1000, "pattern": ".*\\S.*" }
        }
      },
      "PlanApproval": {
        "type": "object",
        "additionalProperties": false,
        "required": ["approvalId", "planId", "planVersion", "scheduleSnapshotId", "planDigest", "scheduleDigest", "reason", "approvedAt"],
        "properties": {
          "approvalId": { "type": "string", "format": "uuid" },
          "planId": { "type": "string", "format": "uuid" },
          "planVersion": { "type": "integer", "minimum": 1 },
          "scheduleSnapshotId": { "type": "string", "format": "uuid" },
          "planDigest": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "scheduleDigest": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
          "reason": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "approvedAt": { "type": "string", "format": "date-time" }
        }
      },
      "PlanApprovalCreateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["approval", "replayed"],
        "properties": {
          "approval": { "$ref": "#/components/schemas/PlanApproval" },
          "replayed": { "type": "boolean" }
        }
      },
      "PlanApprovalReadResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["approval"],
        "properties": {
          "approval": { "oneOf": [{ "$ref": "#/components/schemas/PlanApproval" }, { "type": "null" }] }
        }
      },
      "ExecutionTask": {
        "type": "object",
        "additionalProperties": false,
        "required": ["taskId", "title", "ownerRole", "plannedStart", "plannedFinish", "status", "blockerReason", "actualStart", "actualFinish", "note", "sequenceNo", "updatedAt"],
        "properties": {
          "taskId": { "type": "string", "minLength": 1, "maxLength": 300 },
          "title": { "type": "string", "minLength": 1, "maxLength": 300 },
          "ownerRole": { "type": "string", "minLength": 1, "maxLength": 200 },
          "plannedStart": { "type": ["string", "null"], "format": "date" },
          "plannedFinish": { "type": ["string", "null"], "format": "date" },
          "status": { "type": "string", "enum": ["not_started", "in_progress", "blocked", "completed", "cancelled"] },
          "blockerReason": { "type": ["string", "null"], "maxLength": 2000 },
          "actualStart": { "type": ["string", "null"], "format": "date" },
          "actualFinish": { "type": ["string", "null"], "format": "date" },
          "note": { "type": ["string", "null"], "maxLength": 4000 },
          "sequenceNo": { "type": "integer", "minimum": 0 },
          "updatedAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "ExecutionReadResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["projectId", "planId", "planVersion", "editable", "tasks"],
        "properties": {
          "projectId": { "type": "string", "format": "uuid" },
          "planId": { "type": "string", "format": "uuid" },
          "planVersion": { "type": "integer", "minimum": 1 },
          "editable": { "type": "boolean" },
          "tasks": { "type": "array", "minItems": 1, "maxItems": 1000, "items": { "$ref": "#/components/schemas/ExecutionTask" } }
        }
      },
      "ExecutionUpdateRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["expectedPlanVersion", "taskId", "expectedExecutionSequence", "status"],
        "properties": {
          "expectedPlanVersion": { "type": "integer", "minimum": 1 },
          "taskId": { "type": "string", "minLength": 1, "maxLength": 300 },
          "expectedExecutionSequence": { "type": "integer", "minimum": 0 },
          "status": { "type": "string", "enum": ["not_started", "in_progress", "blocked", "completed", "cancelled"] },
          "blockerReason": { "type": ["string", "null"], "maxLength": 2000 },
          "actualStart": { "type": ["string", "null"], "format": "date" },
          "actualFinish": { "type": ["string", "null"], "format": "date" },
          "note": { "type": ["string", "null"], "maxLength": 4000 }
        }
      },
      "ExecutionUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": ["taskId", "sequenceNo", "status", "blockerReason", "actualStart", "actualFinish", "note", "updatedAt"],
        "properties": {
          "taskId": { "type": "string", "minLength": 1, "maxLength": 300 },
          "sequenceNo": { "type": "integer", "minimum": 1 },
          "status": { "type": "string", "enum": ["not_started", "in_progress", "blocked", "completed", "cancelled"] },
          "blockerReason": { "type": ["string", "null"], "maxLength": 2000 },
          "actualStart": { "type": ["string", "null"], "format": "date" },
          "actualFinish": { "type": ["string", "null"], "format": "date" },
          "note": { "type": ["string", "null"], "maxLength": 4000 },
          "updatedAt": { "type": "string", "format": "date-time" }
        }
      },
      "ExecutionUpdateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["update", "replayed"],
        "properties": {
          "update": { "$ref": "#/components/schemas/ExecutionUpdate" },
          "replayed": { "type": "boolean" }
        }
      },
      "ImportError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "retryable",
          "requestId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_INPUT",
              "AUTHORIZATION_REQUIRED",
              "UNSUPPORTED_FORMAT",
              "INVALID_MEDIA_TYPE",
              "INVALID_DOCUMENT",
              "APPROVAL_REQUIRED",
              "PAYLOAD_TOO_LARGE",
              "OBJECT_WRITE_FAILED",
              "OBJECT_INTEGRITY_MISMATCH",
              "IDEMPOTENCY_CONFLICT",
              "INVALID_SERVER_ID",
              "INVALID_SERVER_CLOCK",
              "DATABASE_WRITE_FAILED",
              "PROJECT_NOT_FOUND",
              "PROPOSAL_NOT_AVAILABLE",
              "PROPOSAL_CHANGED",
              "SOURCE_READ_FAILED",
              "SOURCE_NOT_FOUND",
              "SOURCE_INTEGRITY_FAILED",
              "PARSER_FAILED",
              "PARSER_LIMIT_EXCEEDED",
              "PARSER_WARNING",
              "SOURCE_TOO_LARGE",
              "INVALID_SOURCE",
              "INVALID_QUERY",
              "INDEX_NOT_FOUND",
              "INDEX_CONFLICT",
              "INDEX_NOT_READY",
              "SOURCE_STALE",
              "CONTENT_STALE",
              "CITATION_STALE",
              "SCOPE_CONTAMINATION",
              "INDEX_WRITE_FAILED",
              "RETRIEVAL_WRITE_FAILED",
              "RETRIEVAL_READ_FAILED",
              "EXTRACTION_FAILED",
              "NO_CANDIDATES",
              "CANDIDATE_LIMIT_EXCEEDED",
              "REVIEW_CREATE_FAILED",
              "REPOSITORY_FAILURE",
              "REVIEW_NOT_FOUND",
              "CANDIDATE_NOT_FOUND",
              "REVIEW_CONFLICT",
              "REVIEW_INCOMPLETE",
              "PLAN_NOT_FOUND",
              "PLAN_CONFLICT",
              "PLAN_ALREADY_APPROVED",
              "SCHEDULE_NOT_FOUND",
              "SCHEDULE_CONFLICT",
              "SCHEDULE_NOT_READY",
              "APPROVED_PROPOSAL_NOT_FOUND",
              "SOURCE_CONFLICT",
              "WBS_VALIDATION_FAILED",
              "EXECUTION_CONFLICT",
              "PLAN_NOT_APPROVED",
              "TASK_NOT_FOUND",
              "EXECUTION_WRITE_FAILED",
              "EXECUTION_READ_FAILED",
              "INTERNAL_FAILURE"
            ]
          },
          "message": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "requestId": {
            "type": "string"
          }
        }
      }
    },
    "responses": {
      "AuthenticationFailure": {
        "description": "The deployment Bearer or browser-native Basic credential is missing or invalid.",
        "headers": {
          "WWW-Authenticate": {
            "required": true,
            "schema": {
              "type": "string",
              "enum": ["Bearer", "Basic realm=\"MarketOps\", charset=\"UTF-8\""]
            }
          },
          "Cache-Control": {
            "required": true,
            "schema": { "type": "string", "const": "no-store" }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ImportError"
            }
          }
        }
      },
      "ImportFailure": {
        "description": "Stable import failure. Response bodies and logs never include source bytes or storage credentials.",
        "headers": {
          "Cache-Control": {
            "required": true,
            "schema": { "type": "string", "const": "no-store" }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ImportError"
            }
          }
        }
      }
    }
  }
}
