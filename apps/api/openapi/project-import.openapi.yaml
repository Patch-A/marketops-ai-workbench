    },
    "/v1/workbench/briefs/{briefId}": {
      "get": { "operationId": "getBrief", "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }], "parameters": [{ "name": "briefId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }], "responses": { "200": { "description": "Brief", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BriefResult" } } } }, "404": { "$ref": "#/components/responses/ImportFailure" } } }
    },
    "/v1/workbench/research-runs": {
      "post": { "operationId": "createResearchRun", "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }], "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResearchRunCreateRequest" } } } }, "responses": { "201": { "description": "Research run", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResearchRunResult" } } } }, "422": { "$ref": "#/components/responses/ImportFailure" } } }
    },
    "/v1/workbench/research-runs/{runId}": {
      "get": { "operationId": "getResearchRun", "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }], "parameters": [{ "name": "runId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }], "responses": { "200": { "description": "Research run", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ResearchRunResult" } } } }, "404": { "$ref": "#/components/responses/ImportFailure" } } }
    },
    "/v1/workbench/proposal-drafts": {
      "post": { "operationId": "createProposalDraft", "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }], "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProposalDraftCreateRequest" } } } }, "responses": { "201": { "description": "Proposal draft", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProposalDraftResult" } } } }, "422": { "$ref": "#/components/responses/ImportFailure" } } }
    },
    "/v1/workbench/proposal-drafts/{draftId}": {
      "get": { "operationId": "getProposalDraft", "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }], "parameters": [{ "name": "draftId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }], "responses": { "200": { "description": "Proposal draft", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProposalDraftResult" } } } }, "404": { "$ref": "#/components/responses/ImportFailure" } } }
    },
    "/v1/workbench/proposal-drafts/{draftId}/decisions": {
      "post": { "operationId": "decideProposalDraft", "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }], "parameters": [{ "name": "draftId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }], "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProposalDecisionRequest" } } } }, "responses": { "201": { "description": "Decision", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProposalDraftResult" } } } }, "409": { "$ref": "#/components/responses/ImportFailure" }, "422": { "$ref": "#/components/responses/ImportFailure" } } }
    },
