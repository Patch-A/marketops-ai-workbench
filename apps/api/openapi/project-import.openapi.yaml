{
  "openapi": "3.1.0",
  "info": {
    "title": "MarketOps Project Import API",
    "version": "0.4.0",
    "description": "M1 proposal-to-schedule and M2 project retrieval and learning API contract. Authorization scope and completion facts are resolved from the authenticated deployment actor and server records, never from request bodies."
  },
  "paths": {
    "/v1/model-profiles": {
      "get": {
        "operationId": "listModelProfiles",
        "summary": "List model metadata visible in the authenticated deployment scope",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "responses": {
          "200": {
            "description": "Model metadata, without secret values.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelProfileListResult" } } }
          },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      },
      "post": {
        "operationId": "createModelProfile",
        "summary": "Register model metadata and a server-side environment reference",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelProfileCreateRequest" } } }
        },
        "responses": {
          "201": {
            "description": "Model metadata registered.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelProfileMutationResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/model-profiles/{profileId}": {
      "patch": {
        "operationId": "updateModelProfile",
        "summary": "Edit model metadata with optimistic version checking",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "parameters": [
          { "name": "profileId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelProfileUpdateRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Model metadata updated.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelProfileMutationResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "404": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/model-task-matches": {
      "post": {
        "operationId": "matchModelTask",
        "summary": "Select enabled models for a deterministic task capability requirement",
        "security": [
          { "deploymentActor": [] },
          { "browserDeploymentActor": [] }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelTaskMatchRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Preferred and optional backup model metadata, or an unavailable result.",
            "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelTaskMatchResult" } } }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "503": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/project-imports": {
      "post": {
        "operationId": "importProject",
        "summary": "Create a planning project from retained source and approved proposal files",
        "security": [
          {
            "deploymentActor": []
          },
          {
            "browserDeploymentActor": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 200
            },
            "description": "A caller-generated retry key scoped by the server-authenticated workspace and client."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "projectName",
                  "proposalVersion",
                  "approvalConfirmed",
                  "sourceFile",
                  "proposalFile"
                ],
                "properties": {
                  "projectName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 300
                  },
                  "proposalVersion": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "approvalConfirmed": {
                    "type": "boolean",
                    "const": true
                  },
                  "sourceFile": {
                    "type": "string",
                    "format": "binary",
                    "x-max-size-bytes": 26214400
                  },
                  "proposalFile": {
                    "type": "string",
                    "format": "binary",
                    "x-max-size-bytes": 26214400
                  }
                }
              },
              "encoding": {
                "sourceFile": {
                  "contentType": "text/markdown, text/plain, text/csv, application/csv, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                },
                "proposalFile": {
                  "contentType": "text/markdown, text/plain, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Project created or an identical idempotent import replayed.",
            "headers": {
              "Location": {
                "required": true,
                "schema": {
                  "type": "string",
                  "pattern": "^/v1/projects/[0-9a-f-]{36}$"
                }
              },
              "Cache-Control": {
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "projectId",
                    "sourceArtifactId",
                    "sourceVersionId",
                    "proposalArtifactId",
                    "proposalVersionId",
                    "manifestSha256",
                    "replayed"
                  ],
                  "properties": {
                    "projectId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "sourceArtifactId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "sourceVersionId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "proposalVersionId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "proposalArtifactId": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "manifestSha256": {
                      "type": "string",
                      "pattern": "^[a-f0-9]{64}$"
                    },
                    "replayed": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ImportFailure" },
          "401": { "$ref": "#/components/responses/AuthenticationFailure" },
          "403": { "$ref": "#/components/responses/ImportFailure" },
          "409": { "$ref": "#/components/responses/ImportFailure" },
          "413": { "$ref": "#/components/responses/ImportFailure" },
          "415": { "$ref": "#/components/responses/ImportFailure" },
          "422": { "$ref": "#/components/responses/ImportFailure" },
          "500": { "$ref": "#/components/responses/ImportFailure" }
        }
      }
    },
    "/v1/workbench/briefs": {
      "get": { "operationId": "listBriefs", "security": [{ "deploymentActor": [] }, { "browserDeploymentActor": [] }], "responses": { "200": { "description": "Briefs", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BriefListResult" } } } }, "401": { "$ref": "#/components/responses/AuthenticationFailure" }, "503": { "$ref": "#/components/responses/ImportFailure" } } },
