name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check documentation links and encoding
        run: node scripts/check-docs.mjs
      - name: Check project progress registry
        run: node scripts/progress.mjs check
      - name: Check public validation fixture
        run: node scripts/check-validation-set.mjs public
      - name: Check document parser spike
        run: python scripts/check_document_parser.py --check
