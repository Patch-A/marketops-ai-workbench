name: Feature proposal
description: Propose a scoped product capability with evidence and acceptance criteria.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: user-problem
    attributes:
      label: User problem
      description: Describe the real project task and current workaround.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link a real, anonymized example or explain what still needs validation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable behavior, failure states, and data boundaries.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Data, permission, and license impact
